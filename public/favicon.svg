<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mivloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9557F5" />
      <stop offset="50%" stop-color="#6128C8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fundo escuro com bordas arredondadas -->
  <rect width="64" height="64" rx="16" fill="#08070D" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#mivloGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Monograma M estilizado MIVLO -->
  <path d="M16 46 V20 L26 34 L32 25 L38 34 L48 20 V46" 
        fill="none" 
        stroke="url(#mivloGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <!-- Núcleo central brilhante -->
  <circle cx="32" cy="25" r="2.5" fill="#FFFFFF" />
</svg>
